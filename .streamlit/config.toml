# Diseño editorial: negro y blanco puros y un solo acento (el azul de resaltador).
# Los detalles (grilla, títulos, secciones negras) están en interfaz/estilo.css.
# El mapa 3D no usa este tema: va siempre sobre negro, con su propia paleta (venomscope/mapa.py).

[server]
# Sirve static/, donde están las tipografías: así la app no las pide a internet.
enableStaticServing = true

[theme]
base = "light"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ffffff"
textColor = "#000000"
primaryColor = "#000000"
borderColor = "#000000"
linkColor = "#000000"
baseRadius = "none"
font = "Space Grotesk"
headingFont = "Space Grotesk"
codeFont = "JetBrains Mono"
codeBackgroundColor = "#ffffff"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70"]

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fuentes/SpaceGrotesk.ttf"
weight = "300 700"

[[theme.fontFaces]]
family = "Silkscreen"
url = "app/static/fuentes/Silkscreen-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fuentes/JetBrainsMono.ttf"
weight = "100 800"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
