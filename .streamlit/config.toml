# Diseño editorial oscuro. La paleta es la del mapa 3D (venomscope/mapa.py), así
# la app y el gráfico son la misma cosa. Los detalles (grilla, títulos, secciones)
# están en interfaz/estilo.css.

[server]
# Sirve static/, donde están las tipografías: así la app no las pide a internet.
enableStaticServing = true

[theme]
base = "dark"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0a0a0a"
textColor = "#e4e4e7"
primaryColor = "#d95926"       # el naranja de "tu secuencia" en el mapa
borderColor = "#242424"
linkColor = "#3987e5"
baseRadius = "none"
font = "Space Grotesk"
headingFont = "Space Grotesk"
codeFont = "JetBrains Mono"
codeBackgroundColor = "#0a0a0a"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70"]

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fuentes/SpaceGrotesk.ttf"
weight = "300 700"

[[theme.fontFaces]]
family = "Silkscreen"
url = "app/static/fuentes/Silkscreen-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fuentes/JetBrainsMono.ttf"
weight = "100 800"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
